name: Build
permissions:
    contents: read
on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch card data
        run: node bin/fetchdata.js prod

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint
